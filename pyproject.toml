[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parking-subscriptions"
version = "0.1.0"
description = "Manages monthly parking subscriptions: registration, tracking, and expiry notifications."
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
parking-subscriptions = "parking_subscriptions.cli:main"

[tool.setuptools.packages.find]
include = ["parking_subscriptions*"]
